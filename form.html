<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="author" content="Art 444 Student Form component">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  
  <title>Contact Form</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/responsive.css">
    <body>
        <section class="form_section">
            <div class="form_container">
                <h1>Contact Me!</h1>
                <form>
                    <div class="first_name_input"style="display:flex; flex-direction: column;">
                        <label for="first_name">First Name</label>
                        <input id="first_name" name="first_name" type="text" placeholder="Ex. John" required/>
                    </div>
                    <br>
                    <div class="last_name_input" style="display:flex; flex-direction: column;">
                        <label for="last_name">Last Name</label>
                        <input id="last_name" name="last_name" type="text" placeholder="Ex. Doe" required/>
                    </div>
                    <br>
                    <div class="email_input" style="display:flex; flex-direction: column;">
                        <label for="email">Email Address</label>
                        <input id="email" name="email" type="email" placeholder="example@email.com" required/>
                    </div>
                    <br>
                    <div class="phone_input" style="display:flex; flex-direction: column;">
                        <label for="phone">Phone Numbers</label>
                        <input id="phone" name="phone" type="tel" placeholder="(xxx) xxx-xxxx" required maxlength="10"/>
                    </div>
                    <br>
                    <div class="choices_question">
                        <span>What will you said to yourself 10 years ago?</span>
                        <br>
                        <input type="checkbox" id="vehicle1" name="vehicle1" value="Bike">
                        <label for="vehicle1"> I want to travel back to the past.</label><br>
                        <input type="checkbox" id="vehicle2" name="vehicle2" value="Car">
                        <label for="vehicle2"> I want to grow and embrace my past.</label><br>
                        <input type="checkbox" id="vehicle3" name="vehicle3" value="Boat">
                        <label for="vehicle3"> I want to embrace the future.</label><br><br>
                    </div>
                    <input type="button" value="SUBMIT YOUR INFO!"/>
            </div>
            
        </section>

    </body>
</head>
</html>
