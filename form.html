        <section class="form_section">
            <div class="form_container">
                <h1 class="contact_title">Contact Me!</h1>
                <form>
                    <div class="first_name_input input-container" style="display:flex; flex-direction: column;">
                        <label for="first_name">First Name</label>
                        <input id="first_name" class="typing" name="first_name" type="text" placeholder="Ex. John" required />
                    </div>
                    <br>
                    <div class="last_name_input input-container" style="display:flex; flex-direction: column;">
                        <label for="last_name">Last Name</label>
                        <input id="last_name" class="typing" name="last_name" type="text" placeholder="Ex. Doe" required />
                    </div>
                    <br>
                    <div class="email_input input-container" style="display:flex; flex-direction: column;">
                        <label for="email">Email Address</label>
                        <input id="email" class="typing" name="email" type="email" placeholder="example@email.com" required />
                    </div>
                    <br>
                    <div class="phone_input input-container" style="display:flex; flex-direction: column;">
                        <label for="phone">Phone Numbers</label>
                        <input id="phone" class="typing" name="phone" type="tel" placeholder="(xxx) xxx-xxxx" required
                            maxlength="10" />
                    </div>
                    <br>
                    <div class="choices_question input-container">
                        <span>What will you said to yourself 10 years ago?</span>
                        <br>
                        <input type="radio" id="answer1" name="answer" value="1">
                        <label for="answer1"> I want to travel back to the past.</label><br>
                        <input type="radio" id="answer2" name="answer" value="2">
                        <label for="answer2"> I want to grow and embrace my past.</label><br>
                        <input type="radio" id="answer3" name="answer" value="3">
                        <label for="answer3"> I want to embrace the future.</label><br><br>
                    </div>
                    <input type="button" value="SUBMIT YOUR INFO!" />
            </div>

        </section>
