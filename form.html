<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="author" content="Art 444 Student Form component">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  
  <title>Email Form</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/responsive.css">
    <body>
        <section>
            <div class="container">
                <h1>Contact Me!</h1>
                <form>
                    <div style="display:flex; flex-direction: column;">
                        <label for="first-name">First Name</label>
                        <input id="first-name" name="first-name" type="text" placeholder="ei Tuong Truong" required/>
                    </div>
                    <br>
                    <div style="display:flex; flex-direction: column;">
                        <label for="last-name">Last Name</label>
                        <input id="last-name" name="last-name" type="text" placeholder="ei Truong" required/>
                    </div>
                    <br>
                    <div style="display:flex; flex-direction: column;">
                        <label for="email">Email Address</label>
                        <input id="email" name="email" type="email" placeholder="EMAIL" required/>
                    </div>
                    <br>
                    <div style="display:flex; flex-direction: column;">
                        <label for="phone">Phone Numbers</label>
                        <input id="phone" name="phone" type="phone" placeholder="Phone Numbers" required maxlength="10"/>
                    </div>
                    <div>
                        <span>What will you said to yourself 10 years ago?</span>
                        <selection>
                            <input type="checkbox" value="choice-1">I want to travel back to the past.</input>
                            <input type="checkbox" value="choice-2">I want to grow and embrace my past.</input>
                            <input type="checkbox" value="choice-3">I want to embrace the future.</input>
                        </selection>
                        <input type="button" value="SUBMIT YOUR INFO!"/>
                    </div>
                </form>
            </div>
        </section>

    </body>
</head>
</html>
