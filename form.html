<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="author" content="Art 444 Student Form component">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  
  <title>Contact Form</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/responsive.css">
    <body>
        <section>
            <div class="FormContainer">
                <h1>Contact Me!</h1>
                <form>
                    <div class="first_name_input"style="display:flex; flex-direction: column;">
                        <label for="first_name">First Name</label>
                        <input id="first_name" name="first_name" type="text" placeholder="Ex. John" required/>
                    </div>
                    <br>
                    <div class="last_name_input" style="display:flex; flex-direction: column;">
                        <label for="last_name">Last Name</label>
                        <input id="last_name" name="last_name" type="text" placeholder="Ex. Doe" required/>
                    </div>
                    <br>
                    <div class="email_input" style="display:flex; flex-direction: column;">
                        <label for="email">Email Address</label>
                        <input id="email" name="email" type="email" placeholder="example@email.com" required/>
                    </div>
                    <br>
                    <div class="phone_input" style="display:flex; flex-direction: column;">
                        <label for="phone">Phone Numbers</label>
                        <input id="phone" name="phone" type="tel" placeholder="(xxx) xxx-xxxx" required maxlength="10"/>
                    </div>
                    <div>
                        <span>What will you said to yourself 10 years ago?</span>
                        <selection>
                            <input type="checkbox" value="choice-1">I want to travel back to the past.</input>
                            <input type="checkbox" value="choice-2">I want to grow and embrace my past.</input>
                            <input type="checkbox" value="choice-3">I want to embrace the future.</input>
                        </selection>
                        <input type="button" value="SUBMIT YOUR INFO!"/>
                    </div>
                </form>
            </div>
        </section>

    </body>
</head>
</html>
