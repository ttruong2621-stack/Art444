<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="author" content="Art 444 Student Form component">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  
  <title>Email Form</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/responsive.css">
    <body>
        <section>
            <div class="container">
                <h1>Contact Me!</h1>
                <form>
                    <div style="display:flex; flex-direction: column;">
                        <label for="full-name">Full Name</label>
                        <input id="full-name" name="full-name" type="text" placeholder="ei Tuong Truong" required/>
                    </div>
                    <br>
                    <div style="display:flex; flex-direction: column;">
                        <label for="email">Email</label>
                        <input id="email" name="email" type="email" placeholder="EMAIL" required/>
                    </div>
                    <br>
                    <div style="display:flex; flex-direction: column;">
                        <label for="phone">Phone</label>
                        <input id="phone" name="phone" type="phone" placeholder="Phone Numbers" required maxlength="10"/>
                    </div>
                    <br>
                    <div style="display:flex; flex-direction: column;">
                        <label for="resume">Resume</label>
                        <input id="resume" name="resume" type="file"required/>
                    </div>
                    <br>
                    <div style="display:flex; flex-direction: column;">
                        <label for="color">What is your favorite color</label>
                        <input id="color" name="color" type="color" required/>
                    </div>
                    <br>
                    <div style="display:flex; flex-direction: column;">
                        <label for="date">What is your birthday</label>
                        <input id="date" name="date" type="date" required/>
                    </div>
                    <div>
                        <span>What do you think happens when we die?</span>
                        <label><input type="radio" value="choice-1">Heck if I know?</label>
                        <label><input type="radio" value="choice-2">I know for sure</label>
                        <label><input type="radio" value="choice-3">How morbic!</label>
                    </div>
                    <div>
                        <span>What do you think happens when we die?</span>
                        <selection>
                            <option value="choice-1"><input type="radio" value="choice-1">Heck if I know?</option>
                            <option value="choice-2"><input type="radio" value="choice-2">I know for sure</option>
                            <option value="choice-3"><input type="radio" value="choice-3">How morbic!</option>
                        </selection>
                        <input type="button" value="SUBMIT YOUR INFO!"/>
                    </div>
                </form>
            </div>
        </section>

    </body>
</head>
</html>
